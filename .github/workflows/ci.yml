name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v

      - name: Run live EDGAR checkpoint test
        env:
          EDGAR_USER_AGENT: "Disclosure Verifier CI ci@disclosure-verifier.dev"
        run: pytest -v -m network
        continue-on-error: true
