[project]
name = "disclosure-verifier"
version = "0.1.0"
description = "Agentic system for verifying quantitative claims in corporate financial disclosures"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["tools*", "agents*", "eval*"]
