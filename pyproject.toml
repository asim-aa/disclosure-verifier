[project]
name = "disclosure-verifier"
version = "0.1.0"
description = "Agentic system for verifying quantitative claims in corporate financial disclosures"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "dspy>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
# Phase 7 (RLVR/GRPO fine-tuning) — heavy, GPU-only, installed separately on the
# training box (not needed for the rest of the project). See phase7/README.md.
phase7 = [
    "torch>=2.5.0",
    # ==4.55.0, not the >=4.46.0 this started as: unsloth 2025.7.2's own PyPI
    # metadata declares transformers>=4.51.3 with no upper bound, which let a
    # fresh `uv sync` resolve to transformers 5.12.1 - a major version
    # unsloth's internal exec()-based monkey-patching (unsloth/models/_utils.py)
    # wasn't written against (`NameError: name 'auto_docstring' is not
    # defined`). The newest 4.x (4.57.6) isn't safe either: transformers
    # renamed PretrainedConfig's serialized dtype key from "torch_dtype" to
    # "dtype" between 4.55.0 and 4.56.0 (confirmed by diffing both sdists'
    # configuration_utils.py), and unsloth/models/loader.py still does
    # `model.config.to_dict()["torch_dtype"]` unconditionally, so anything
    # >=4.56.0 hits `KeyError: 'torch_dtype'` loading any model - reproduced
    # on a real training-box install, immediately after the previous fix
    # got past model checkpoint loading. 4.55.0 is the newest release still
    # inside both the pre-rename window and unsloth's own declared range.
    "transformers==4.55.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    # ==0.18.0 pinned deliberately, not a loose range: trl removed
    # trl.trainer.utils.ConstantLengthDataset somewhere between 0.18.0 and 0.19.0
    # (confirmed by downloading both sdists and diffing - it's a real, reproduced
    # ImportError from a fresh training-box install, not a hypothetical), and
    # unsloth_zoo's dataset_utils.py still imports it unconditionally at module
    # load time regardless of trl version. 0.18.0 is the newest release verified
    # to still export it (and to still have GRPOTrainer/GRPOConfig, both checked
    # directly against its source). No upper bound previously meant a fresh
    # `uv sync` months after the original run silently resolved to whatever trl
    # happened to be newest (1.12.0) and broke immediately on import - pinning
    # to a range instead of this exact tested version would just move the same
    # risk to some other untested point in between.
    "trl==0.18.0",
    "bitsandbytes>=0.44.0",
    "datasets>=3.0.0",
    "unsloth",
    "unsloth_zoo",
    "mergekit",  # trl 0.24's GRPOTrainer imports this internally; not auto-pulled as a dependency
    "llm-blender",  # ditto — pulled in transitively via trl.trainer.callbacks -> trl.trainer.judges
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits the real SEC EDGAR API (excluded by default; run with -m network)",
    "llm: hits the live LLM backend, only reachable on the bootcamp network (excluded by default; run with -m llm)",
]
addopts = "-m 'not network and not llm'"
filterwarnings = [
    "ignore::bs4.XMLParsedAsHTMLWarning",
]

[tool.setuptools.packages.find]
include = ["tools*", "agents*", "eval*"]
